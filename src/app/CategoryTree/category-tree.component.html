<div class="add-root-category">
  <button mat-button color="primary" (click)="addRootCategory()">
    <mat-icon>add</mat-icon> Add Root Category
  </button>
</div>

<mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="clean-tree">
  <div *ngIf="dataSource.data.length === 0" class="empty-state">
    <p>No categories available. Add a category to get started.</p>
    <button mat-raised-button color="primary" (click)="addRootCategory()">
      <mat-icon>add</mat-icon> Add Category 
    </button>
  </div>

  <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding>
    <button mat-icon-button disabled></button>
    <span *ngIf="!node.isEditing">{{node.name}}</span>
    <input *ngIf="node.isEditing" [(ngModel)]="node.name" class="edit-input" />
    
    <span class="node-actions">
      <button mat-icon-button (click)="editNode(node)" aria-label="Edit node">
        <mat-icon>{{node.isEditing ? 'check' : 'edit'}}</mat-icon>
      </button>
      <button mat-icon-button (click)="deleteNode(node)" aria-label="Delete node">
        <mat-icon>delete</mat-icon>
      </button>
      <button mat-icon-button (click)="addChild(node)" aria-label="Add child">
        <mat-icon>add</mat-icon>
      </button>
    </span>
  </mat-tree-node>
  
  <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
    <div class="mat-tree-node">
      <button mat-icon-button matTreeNodeToggle [attr.aria-label]="'Toggle ' + node.name">
        <mat-icon class="mat-icon-rtl-mirror">
          {{treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
        </mat-icon>
      </button>
      
      <span *ngIf="!node.isEditing">{{node.name}}</span>
      <input *ngIf="node.isEditing" [(ngModel)]="node.name" class="edit-input" />
      
      <span class="node-actions">
        <button mat-icon-button (click)="editNode(node)" aria-label="Edit node">
          <mat-icon>{{node.isEditing ? 'check' : 'edit'}}</mat-icon>
        </button>
        <button mat-icon-button (click)="deleteNode(node)" aria-label="Delete node">
          <mat-icon>delete</mat-icon>
        </button>
        <button mat-icon-button (click)="addChild(node)" aria-label="Add child">
          <mat-icon>add</mat-icon>
        </button>
      </span>
    </div>
    
    <div [class.tree-invisible]="!treeControl.isExpanded(node)" role="group">
      <ng-container matTreeNodeOutlet></ng-container>
    </div>
  </mat-nested-tree-node>
</mat-tree>
