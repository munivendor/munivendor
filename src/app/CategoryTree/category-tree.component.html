<div>
  <button mat-button color="primary" (click)="addRootCategory()">
    <mat-icon>add</mat-icon> Add Root Category
  </button>
</div>

<mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="clean-tree">
  <mat-tree-node *matTreeNodeDef="let node">
    <button mat-icon-button disabled></button>
    <div [ngStyle]="{ 'padding-left.px': getNodeIndent(node.level), opacity: node.deleted ? 0.5 : 1 }"
      class="mat-tree-node">
      <span *ngIf="!node.isEditing">{{ node.name }}</span>
      <input *ngIf="node.isEditing" [(ngModel)]="node.tempName" class="edit-input" (blur)="saveNodeEdit(node)" />
      <span class="badge" *ngIf="node.deleted">Deleted</span>
      <span class="node-actions" *ngIf="!node.deleted">
        <button mat-icon-button (click)="node.isEditing ? saveNodeEdit(node) : editNode(node)">
          <mat-icon>{{ node.isEditing ? 'check' : 'edit' }}</mat-icon>
        </button>
        <button mat-icon-button (click)="deleteNode(node)">
          <mat-icon>delete</mat-icon>
        </button>
        <button mat-icon-button (click)="addChild(node)">
          <mat-icon>add</mat-icon>
        </button>
      </span>
    </div>
  </mat-tree-node>

  <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
    <div class="mat-tree-node"
      [ngStyle]="{ 'padding-left.px': getNodeIndent(node.level), opacity: node.deleted ? 0.5 : 1 }">
      <button mat-icon-button matTreeNodeToggle [attr.aria-label]="'Toggle ' + node.name">
        <mat-icon class="mat-icon-rtl-mirror">
          {{ treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right' }}
        </mat-icon>
      </button>
      <span *ngIf="!node.isEditing">{{ node.name }}</span>
      <input *ngIf="node.isEditing" [(ngModel)]="node.tempName" class="edit-input" (blur)="saveNodeEdit(node)" />
      <span class="badge" *ngIf="node.deleted">Deleted</span>
      <span class="node-actions" *ngIf="!node.deleted">
        <button mat-icon-button (click)="node.isEditing ? saveNodeEdit(node) : editNode(node)">
          <mat-icon>{{ node.isEditing ? 'check' : 'edit' }}</mat-icon>
        </button>
        <button mat-icon-button (click)="deleteNode(node)">
          <mat-icon>delete</mat-icon>
        </button>
        <button mat-icon-button (click)="addChild(node)">
          <mat-icon>add</mat-icon>
        </button>
      </span>
    </div>
    <div [class.tree-invisible]="!treeControl.isExpanded(node)" role="group">
      <ng-container matTreeNodeOutlet></ng-container>
    </div>
  </mat-nested-tree-node>
</mat-tree>
