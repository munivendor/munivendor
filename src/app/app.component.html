<div *ngIf="showSidenav$ | async; else noSidenav" class="app-with-sidenav">
  <custom-sidenav
    [organizationTypeId]="organizationTypeId"
    (logOut)="onLogOut()"
  >
  </custom-sidenav>
</div>

<ng-template #noSidenav>
  <div class="full-width-content">
    <router-outlet></router-outlet>
  </div>
</ng-template>
