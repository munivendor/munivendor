

<form [formGroup]="requestOverviewForm" (ngSubmit)="onSubmit()">
  <p> Request Review</p>
  <br>
  <div>
    <select  class="form-control">  
      <option>Choose Request Type</option>  
      <option *ngFor="let requestType of requestTypes">{{requestType}}</option>  
  </select>  
          <!--<div *ngIf="requestOverviewForm.get('requestType')?.invalid && requestOverviewForm.get('requestType')?.touched">
            <div *ngIf="requestOverviewForm.get('requestType')?.errors?.['required']">Request Type is required.</div>
          </div>-->
  </div>

  <div>
   
    <select  class="form-control" (change)="changeSubcategory($event)" formControlName="subcategory">  
      <option>Choose subcategory</option> 
      
      <option *ngFor="let subcategory of subcategories">{{subcategory}}</option>  
  </select>  
    <div *ngIf="requestOverviewForm.get('subcategory')?.invalid && requestOverviewForm.get('subcategory')?.touched">
      <div *ngIf="requestOverviewForm.get('subcategory')?.errors?.['required']">Subcategory is required.</div>
    </div>
  </div>
  <div>
    <input type="text" id="rcorners1" formControlName="specificRequestType">
      <div *ngIf="requestOverviewForm.get('specificRequestType')?.invalid && requestOverviewForm.get('specificRequestType')?.touched">
        <div *ngIf="requestOverviewForm.get('specificRequestType')?.errors?.['required']">Lastname is required.</div>
      </div>
  </div>
  <div>
  <input type="date" id="rcorners1"  formControlName="publishDate">
  </div>
  <div>
  <input type="time" id="rcorners1" formControlName="publishTime" >
  </div>
  <div>
    <input type="date" id="rcorners1"  formControlName="openDate">
  </div>
  <div>
    <input type="time" id="rcorners1"  formControlName="openTime">
  </div>
  <div>
    <input type="term" id="term"  formControlName="term">
  </div>
  <div>
    <select formControlName="decisionMaker" class="form-control">  
      <option>Choose Decision Maker</option>  
      <option *ngFor="let decisionMaker of decisionMakers">{{decisionMaker}}</option>  
  </select>  
  <div *ngIf="requestOverviewForm.get('decisionMaker')?.invalid && requestOverviewForm.get('decisionMaker')?.touched">
    <div *ngIf="requestOverviewForm.get('decisionMaker')?.errors?.['required']">Decision Maker is required.</div>
  </div>
  </div>
      <br>
      <br>
      <br>
  <div>
  <a [routerLink]="['/second-component']" routerLinkActive="router-link-active" >continue </a>
  <button type="submit" [disabled]="requestOverviewForm.invalid">Login</button>
  </div>
</form>
