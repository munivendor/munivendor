<h1>Requests</h1>
<div class="mat-elevation-z8">
<table mat-table [dataSource]="dataSource">
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let request">
      <div class="action-button-container" style="align-items: center;">
        <button *ngIf="canEdit(request)" (click)="openConfirmationDialog('edit', request)">Edit</button>
        <button *ngIf="canDelete(request)" (click)="openConfirmationDialog('delete', request)">Delete</button>
        <button *ngIf="canCancel(request)" (click)="openConfirmationDialog('cancel', request)">Cancel</button>
      </div>
    </td>
  </ng-container>

  <ng-container matColumnDef="requestName">
    <th mat-header-cell *matHeaderCellDef> Request Name </th>
    <td mat-cell *matCellDef="let request"> {{ request.requestName }} </td>
  </ng-container>

  <ng-container matColumnDef="requestType">
    <th mat-header-cell *matHeaderCellDef> Type </th>
    <td mat-cell *matCellDef="let request"> {{ request.requestType.requestTypeDesc }} </td>
  </ng-container>

  <ng-container matColumnDef="category">
    <th mat-header-cell *matHeaderCellDef> Category </th>
    <td mat-cell *matCellDef="let request"> {{ request.category.name }} </td>
  </ng-container>

  <ng-container matColumnDef="publishDate">
    <th mat-header-cell *matHeaderCellDef> Publish Date </th>
    <td mat-cell *matCellDef="let request"> {{ request.publishDate | date }} </td>
  </ng-container>

  <ng-container matColumnDef="requestStatus">
    <th mat-header-cell *matHeaderCellDef> Status </th>
    <td mat-cell *matCellDef="let request"> {{ request.requestStatus.requestStatusDesc }} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<mat-paginator [length]="100"
              [pageSize]="10"
              [pageSizeOptions]="[5, 10, 25, 100]"
              aria-label="Select page">
</mat-paginator>
</div>
