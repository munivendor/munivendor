<mat-stepper [linear]="false" #stepper>
  <mat-step [stepControl]="basicsFormGroup" label="Basics" [completed]="basicsFormGroup.valid">
    <form [formGroup]="basicsFormGroup">
      <request-basic [parentFormGroup]="basicsFormGroup" (requestData)="onRequestDataReceived($event)"
        (deleteDropdown)="deleteDropdownFromRequest($event)"></request-basic>
      <div>
        <button mat-button matStepperNext [disabled]="!basicsFormGroup.valid" (click)="saveRequestData()">Next</button>
      </div>
    </form>
  </mat-step>

  <mat-step [stepControl]="proposalsOverviewFormGroup" label="Proposals">
    <form [formGroup]="proposalsOverviewFormGroup">
        <request-overview [parentProposalsOverviewFormGroup]="proposalsOverviewFormGroup"
        (proposalOverviewData)="onProposalSectionsReceived($event)"></request-overview>
      <div>
        <button mat-button matStepperPrevious>Back</button>
        <button mat-button matStepperNext [disabled]="!proposalsOverviewFormGroup.valid" (click)="saveSections()">Next</button>
      </div>
    </form>
  </mat-step>

  <mat-step [stepControl]="requestDocumentsFormGroup" label="Documents">
    <form [formGroup]="requestDocumentsFormGroup">
      <request-required-documents [parentDocumentsFormGroup]="requestDocumentsFormGroup" (documentsUpdated)="onDocumentsUpdated($event)"></request-required-documents>
      <div>
        <button mat-button matStepperPrevious>Back</button>
        <button mat-button matStepperNext (click)="saveDocuments()">Next</button>
      </div>
    </form>
  </mat-step>

  <mat-step [stepControl]="finalReviewFormGroup" label="Review">
    <form [formGroup]="finalReviewFormGroup">
      <request-review></request-review>
      <div>
        <button mat-button matStepperPrevious>Back</button>
        <button mat-button matStepperNext>Next</button>
      </div>
    </form>
  </mat-step>

  <mat-step>
    <ng-template matStepLabel>Done</ng-template>
    <p>You are now done.</p>
    <div>
      <button mat-button matStepperPrevious>Back</button>
      <button mat-button (click)="stepper.reset()">Reset</button>
    </div>
  </mat-step>
</mat-stepper>
