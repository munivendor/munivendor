<h2 mat-dialog-title>Confirmation</h2>
<mat-dialog-content>
  <p>Are you sure you want to {{ data.action }} this request?</p>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="onNoClick()">No</button>
  <button mat-button (click)="confirm()">Yes</button>
</mat-dialog-actions>
