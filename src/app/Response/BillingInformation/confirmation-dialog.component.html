<h2 mat-dialog-title>Confirm Payment Mathod</h2>
<mat-dialog-content>
  <p>Are you sure you want to save this payment method?</p>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close (click)="onCancel()">Cancel</button>
  <button
    mat-button
    [mat-dialog-close]="true"
    cdkFocusInitial
    color="primary"
    (click)="onConfirm()"
  >
    Confirm
  </button>
</mat-dialog-actions>
