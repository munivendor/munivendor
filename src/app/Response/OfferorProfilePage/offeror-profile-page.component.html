<h1 class="page-title">Offeror Profile</h1>

<!-- Child: has its own form, save, and API call -->
<app-offeror-details />

<!-- Inline: Legal — 2 dropdowns, one save -->
<div class="profile-card">
  <div class="card-header">
    <div class="header-accent"></div>
    <div class="header-content">
      <h2 class="card-title">Legal</h2>
    </div>
  </div>

  <form [formGroup]="legalForm" (ngSubmit)="onSaveLegal()" class="card-form">
    <!-- <div class="form-section"> -->
    <div class="subsection-label-group">
      <span class="subsection-label">Contract Failure</span>
      <span class="subsection-hint">
        Within the last five years has the business or any officer/partner
        failed to complete a contract awarded to them?
      </span>
    </div>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Select One</mat-label>
      <mat-select formControlName="contractFailure">
        <mat-option [value]="true">Yes</mat-option>
        <mat-option [value]="false">No</mat-option>
      </mat-select>
    </mat-form-field>
    <!-- </div> -->

    <div class="form-section">
      <div class="subsection-label-group">
        <span class="subsection-label">Liens and/or Lawsuits</span>
        <span class="subsection-hint">
          Have any liens and lawsuits been filed against the company in the past
          five years?
        </span>
      </div>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Select One</mat-label>
        <mat-select formControlName="liensLawsuits">
          <mat-option [value]="true">Yes</mat-option>
          <mat-option [value]="false">No</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="card-footer">
      <button
        mat-flat-button
        color="primary"
        type="submit"
        class="save-btn"
        [disabled]="isSavingLegal || legalForm.pristine"
      >
        <mat-icon *ngIf="!isSavingLegal">save</mat-icon>
        {{ isSavingLegal ? "Saving..." : "Save Changes" }}
      </button>
    </div>
  </form>
</div>
