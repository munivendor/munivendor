<mat-stepper #stepper>
  <mat-step label="Basics">
      <response-basic #step1 [sourceIdParam]="sourceIdParam" [responseIdParam]="responseIdParam" (formValidityChange)="onFormValidityChange($event)"></response-basic>
    <div>
      <button mat-button matStepperNext (click)="saveResponse()"  [disabled]="!isStepValid">Next</button>
    </div>
  </mat-step>

  <mat-step label="Details">
    <response-details #step2 [sourceIdParam]="sourceIdParam"></response-details>
    <div>
      <button type="Submit" mat-button matStepperPrevious>Back</button>
      <button type="Submit" mat-button matStepperNext>Next</button>
    </div>

  </mat-step>

  <mat-step label="Documents">
    <response-documents [sourceIdParam]="sourceIdParam" [responseIdParam]="responseIdParam"></response-documents>
    <div>
      <button type="Submit" mat-button matStepperPrevious>Back</button>
      <button type="Submit" mat-button matStepperNext>Next</button>
    </div>

  </mat-step>
    <mat-step label="Review">
      <response-review [sourceIdParam]="sourceIdParam" [responseIdParam]="responseIdParam"></response-review>
    <div>
      <button type="Submit" mat-button matStepperPrevious>Back</button>
      <button type="Submit" mat-button matStepperNext>Submit</button>
    </div>
  </mat-step>
</mat-stepper>
