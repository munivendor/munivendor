<h2 mat-dialog-title>Confirm Payment Plan</h2>
<mat-dialog-content>
  <p>Your profile has been created with payment plan 'Pay As You Go'. After you use your 5 free submissions, you will only be charged
    $39.00 for each additional submission.</p>
</mat-dialog-content>
<mat-dialog-actions >
  <button mat-button mat-dialog-close (click)="onCancel()">Cancel</button>
  <button mat-button [mat-dialog-close]="true" cdkFocusInitial color="primary" (click)="onConfirm()">Confirm</button>
</mat-dialog-actions>
