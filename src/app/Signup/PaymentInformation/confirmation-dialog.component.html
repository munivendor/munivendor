<h2 mat-dialog-title>Confirm Payment Plan</h2>
<mat-dialog-content>
  <p>Your profile has been created with payment plan X. After you use your 10 free submissions, you will be charged
    $xx.xx/month (auto renews). Cancel anytime.</p>
</mat-dialog-content>
<mat-dialog-actions >
  <button mat-button mat-dialog-close (click)="onCancel()">Cancel</button>
  <button mat-button [mat-dialog-close]="true" cdkFocusInitial color="primary" (click)="onConfirm()">Confirm</button>
</mat-dialog-actions>
