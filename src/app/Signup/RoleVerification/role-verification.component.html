<div>
  <h1>Are you an Offeror or Government Agency?</h1>
  <form [formGroup]="roleVerificationForm" (ngSubmit)="onSubmit($event)">
    <div class="button-container">
      <div>
        <button mat-raised-button color="primary" name="offeror" type="submit">Offeror</button>
      </div>
      <div>
        <button mat-raised-button color="primary" name="governmentAgency" type="submit">Government Agency</button>
      </div>
    </div>
  </form>
</div>
