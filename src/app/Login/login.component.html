<div class="center-container">
  <mat-card class="details-card">
    <mat-card-title class="details-title"
      >Welcome back to MuniVendor</mat-card-title
    >
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div #googleBtnContainer class="google-btn-container">
          <asl-google-signin-button
            *ngIf="buttonWidth"
            type="standard"
            size="medium"
            text="continue_with"
            theme="filled_blue"
            [width]="buttonWidth"
          ></asl-google-signin-button>
        </div>
        <div class="separator">
          <span>OR</span>
        </div>

        <mat-form-field
          appearance="outline"
          class="full-width"
          subscriptSizing="dynamic"
        >
          <mat-label>Work Email/Username</mat-label>
          <input
            matInput
            type="text"
            id="email"
            name="email"
            formControlName="email"
            placeholder="Enter your work email/username"
            autocomplete="username"
          />
          <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
            Work Email/Username is required.
          </mat-error>
          <mat-error
            *ngIf="
              loginForm.get('email')?.hasError('email') ||
              loginForm.get('email')?.hasError('pattern')
            "
          >
            Please enter a valid email address.
          </mat-error>
        </mat-form-field>

        <mat-form-field
          appearance="outline"
          class="full-width"
          subscriptSizing="dynamic"
        >
          <mat-label>Password</mat-label>
          <input
            matInput
            type="password"
            id="password"
            name="password"
            formControlName="password"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            Password is required.
          </mat-error>
        </mat-form-field>

        <div class="forgot-password-row">
          <a class="back-link" [routerLink]="['/forgot-password']"
            >Forgot password?</a
          >
        </div>

        <button
          class="submit-button"
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="loginForm.invalid"
        >
          Log In
        </button>

        <p class="footer-text">
          New to MuniVendor? Click here to
          <a class="back-link" [routerLink]="['/signup']">sign up</a>.
        </p>
      </form>
    </mat-card-content>
  </mat-card>
</div>
