<div class="header">
    <mat-form-field appearance="outline" class="search-box">
      <mat-label>Search</mat-label>
      <input matInput [formControl]="searchControl" placeholder="Search by name or email" />
    </mat-form-field>
  
    <button mat-raised-button color="primary" (click)="addUser()">Add New User</button>
  </div>
  
  <table mat-table [dataSource]="filteredUsers" class="mat-elevation-z8">
  
    <!-- Name & Email Column -->
    <ng-container matColumnDef="nameEmail">
      <th mat-header-cell *matHeaderCellDef> Name & Email </th>
      <td mat-cell *matCellDef="let user">
        {{ user.name }} <br />
        <small>{{ user.email }}</small>
      </td>
    </ng-container>
  
    <!-- Title Column -->
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef> Title </th>
      <td mat-cell *matCellDef="let user"> {{ user.title }} </td>
    </ng-container>
  
    <!-- Role Column -->
    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef> Role </th>
      <td mat-cell *matCellDef="let user"> {{ user.role }} </td>
    </ng-container>
  
    <!-- Designee Column -->
    <ng-container matColumnDef="designee">
      <th mat-header-cell *matHeaderCellDef> Designee </th>
      <td mat-cell *matCellDef="let user"> {{ user.designee }} </td>
    </ng-container>
  
    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let user"> {{ user.status }} </td>
    </ng-container>
  
    <!-- Tags Column -->
    <ng-container matColumnDef="tags">
      <th mat-header-cell *matHeaderCellDef> Tags </th>
      <td mat-cell *matCellDef="let user">
        <mat-chip-set>
          <mat-chip *ngFor="let tag of user.tags">{{ tag }}</mat-chip>
        </mat-chip-set>
      </td>
    </ng-container>
  
    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let user">
        <button mat-button color="warn">Delete</button>
      </td>
    </ng-container>
  
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
