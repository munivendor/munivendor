<div class="user-grid-container">
  <div class="header-actions">
    <mat-form-field appearance="outline">
      <mat-label>Search by name</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Type a name">
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="addNewUser()">Add New User</button>
  </div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

    <!-- Columns Definition -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let user">{{ user.name }}</td>
    </ng-container>

    <!-- Repeat for each column: email, title, role, designation, status -->

    <!-- Tags Column -->
    <ng-container matColumnDef="tags">
      <th mat-header-cell *matHeaderCellDef>Tags</th>
      <td mat-cell *matCellDef="let user">
        <mat-chip-set>
          <mat-chip *ngFor="let tag of user.tags">{{ tag }}</mat-chip>
          <button mat-icon-button (click)="openTagDialog(user)">
            <mat-icon>add</mat-icon>
          </button>
        </mat-chip-set>
      </td>
    </ng-container>

    <!-- Table Rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons (page)="onPageChange()">
  </mat-paginator>
</div>
