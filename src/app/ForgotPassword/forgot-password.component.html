<div class="center-container">
  <mat-card class="details-card">
    <mat-card-title class="details-title"
      >Let's get you back into MuniVendor!</mat-card-title
    >
    <mat-card-content>
      <p class="intro-text">
        Please provide the email address associated with your account, and
        we'll send you a one-time link to reset your password.
      </p>

      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
        <mat-form-field
          appearance="outline"
          class="full-width"
          subscriptSizing="dynamic"
        >
          <mat-label>Email</mat-label>
          <input
            matInput
            type="text"
            formControlName="email"
            id="email"
            name="email"
            autocomplete="email"
            placeholder="Enter your email"
          />
          <mat-error
            *ngIf="forgotPasswordForm.get('email')?.hasError('required')"
          >
            Email is required.
          </mat-error>

          <mat-error
            *ngIf="
              forgotPasswordForm.get('email')?.hasError('email') ||
              forgotPasswordForm.get('email')?.hasError('pattern')
            "
          >
            Please enter a valid email address.
          </mat-error>
        </mat-form-field>

        <button
          *ngIf="!showResendButton"
          class="submit-button"
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="forgotPasswordForm.invalid || isLoading"
        >
          {{ isLoading ? "Sending..." : "Submit" }}
        </button>

        <button
          *ngIf="showResendButton"
          class="submit-button"
          mat-raised-button
          color="primary"
          type="button"
          (click)="onResendLink()"
          [disabled]="isLoading || cooldownRemaining > 0"
        >
          {{
            isLoading
              ? "Sending..."
              : cooldownRemaining > 0
                ? "Resend Link (" + cooldownRemaining + "s)"
                : "Resend Link"
          }}
        </button>

        <a class="back-link" [routerLink]="['/login']">Go Back</a>
      </form>
    </mat-card-content>
  </mat-card>
</div>
