
<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <br>
    <asl-google-signin-button type='icon' size='medium'></asl-google-signin-button>
    <div>
      <input type="text" id="rcorners1"  formControlName="email" value= 'Work email'>
            <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
              <div *ngIf="loginForm.get('email')?.errors?.['required']">Email is required.</div>
              <div *ngIf="loginForm.get('email')?.errors?.['email']">Invalid email format.</div>
            </div>
    </div>

    <div>
      <input type="text" id="rcorners1" formControlName="firstname" value= 'firstname'>
      <div *ngIf="loginForm.get('firstname')?.invalid && loginForm.get('firstname')?.touched">
        <div *ngIf="loginForm.get('firstname')?.errors?.['required']">Firstname is required.</div>
        <div *ngIf="loginForm.get('firstname')?.errors?.['minlength']">Firstname must be at least 3 characters long.</div>
      </div>
    </div>
    <div>
      <input type="text" id="rcorners1" formControlName="lastname" value= 'Lastname'>
        <div *ngIf="loginForm.get('lastname')?.invalid && loginForm.get('lastname')?.touched">
          <div *ngIf="loginForm.get('lastname')?.errors?.['required']">Lastname is required.</div>
          <div *ngIf="loginForm.get('lastname')?.errors?.['minlength']">Lastname must be at least 3 characters long.</div>
        </div>
    </div>
    <div>
    <input type="text" id="rcorners1"  formControlName="title" value= 'Title'>
    </div>
    <div>
    <input type="text" id="rcorners1" formControlName="phoneNumber" value= 'Work phone number'>
    </div>
        <br>
        <br>
        <br>
    <div>
    <a [routerLink]="['/second-component']" routerLinkActive="router-link-active" >continue </a>
    <button type="submit" [disabled]="loginForm.invalid">Login</button>
    </div>
</form>
