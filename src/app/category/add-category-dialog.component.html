<!-- src/app/components/add-category-dialog/add-category-dialog.component.html -->
<h1 mat-dialog-title>Add New Category</h1>
<div mat-dialog-content>
  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Category Name</mat-label>
    <input matInput [(ngModel)]="categoryName" required placeholder="Category Name">
  </mat-form-field>
  <mat-checkbox [(ngModel)]="addUnderParent" *ngIf="data.parentCategory">
    Add under "{{ data.parentCategory?.name }}"
  </mat-checkbox>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-button color="primary" [disabled]="!categoryName" (click)="onAdd()">Add</button>
</div>
