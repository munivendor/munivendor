<h2 mat-dialog-title>Confirm</h2>
<mat-dialog-content>
  <p>All information will be cleared. Do you want to proceed?</p>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-button color="primary" (click)="onConfirm()">Confirm</button>
</mat-dialog-actions>
