<div>
  <h1>Are you a Vendor or LGO?</h1>
  <form [formGroup]="roleVerificationForm" (ngSubmit)="onSubmit($event)">
    <div class="button-container">
      <div>
        <button mat-raised-button color="primary" name="vendor" type="submit">Vendor</button>
      </div>
      <div>
        <button mat-raised-button color="primary" name="municipality" type="submit">LGO</button>
      </div>
    </div>
  </form>
</div>
