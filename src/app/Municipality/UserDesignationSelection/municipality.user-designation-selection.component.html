<mat-card>
  <mat-card-title>Check off any designations if any that apply to you</mat-card-title>
  <mat-card-content>
    <form [formGroup]="designeeSelectionForm" (ngSubmit)="onSubmit()">
      <div formArrayName="selectedDesignees">
        <mat-checkbox *ngFor="let designeeType of designeeTypes; let i = index" [formControlName]="i">
          {{ designeeType }}
        </mat-checkbox>
      </div>
      <button mat-raised-button color="primary" type="submit">Continue</button>
    </form>
  </mat-card-content>
</mat-card>
