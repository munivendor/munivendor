<form [formGroup]="legalDetailsForm" class="legal-details-form">
    <mat-card>
      <mat-card-title>Legal Details</mat-card-title>
      <mat-card-content>
        <!-- Contract Failure -->
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Contract Failure</mat-label>
          <mat-select formControlName="contractFailure" required>
            <mat-option *ngFor="let option of yesNoOptions" [value]="option.value">
              {{ option.label }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="legalDetailsForm.get('contractFailure')?.invalid">
            Please select an option.
          </mat-error>
        </mat-form-field>
  
        <!-- Liens and/or Lawsuits -->
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Liens and/or Lawsuits</mat-label>
          <mat-select formControlName="liensLawsuits" required>
            <mat-option *ngFor="let option of yesNoOptions" [value]="option.value">
              {{ option.label }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="legalDetailsForm.get('liensLawsuits')?.invalid">
            Please select an option.
          </mat-error>
        </mat-form-field>
  
        <!-- Contract Failure Details -->
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Contract Failure Details</mat-label>
          <textarea
            matInput
            formControlName="contractFailureDetails"
            placeholder="Provide details of contract failure, if any."
            rows="4"
          ></textarea>
        </mat-form-field>
  
        <!-- Lien & Lawsuit Details -->
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Lien & Lawsuit Details</mat-label>
          <textarea
            matInput
            formControlName="lienLawsuitDetails"
            placeholder="Provide details of liens and lawsuits, if any."
            rows="4"
          ></textarea>
        </mat-form-field>
      </mat-card-content>
    </mat-card>
  </form>
