<form [formGroup]="prohibitedActivitiesForm" (ngSubmit)="onSubmit()">
    <mat-card>
      <mat-card-title>Prohibited Activities</mat-card-title>
      <mat-card-content>
        <!-- OFAC Identification -->
        <mat-form-field class="full-width" appearance="fill">
          <mat-label>OFAC Identification</mat-label>
          <mat-select formControlName="hasOFACIdentification" required>
            <mat-option value="yes">Yes</mat-option>
            <mat-option value="no">No</mat-option>
          </mat-select>
          <mat-error *ngIf="prohibitedActivitiesForm.get('hasOFACIdentification')?.invalid">
            This field is required.
          </mat-error>
        </mat-form-field>
  
        <!-- Activity Description -->
        <mat-form-field class="full-width" appearance="fill">
          <mat-label>Activity Description</mat-label>
          <textarea matInput formControlName="activityDescription" rows="4"></textarea>
        </mat-form-field>
  
        <!-- Involvement in Iran -->
        <mat-form-field class="full-width" appearance="fill">
          <mat-label>Involvement in Iran</mat-label>
          <mat-select formControlName="involvementInIran" required>
            <mat-option value="yes">Yes</mat-option>
            <mat-option value="no">No</mat-option>
          </mat-select>
          <mat-error *ngIf="prohibitedActivitiesForm.get('involvementInIran')?.invalid">
            This field is required.
          </mat-error>
        </mat-form-field>
  
        <!-- Detailed Description -->
        <mat-form-field class="full-width" appearance="fill">
          <mat-label>Detailed Description</mat-label>
          <textarea matInput formControlName="detailedDescription" rows="4"></textarea>
        </mat-form-field>
      </mat-card-content>
  
      <mat-card-actions>
        <button mat-raised-button color="primary" type="submit" [disabled]="prohibitedActivitiesForm.invalid">
          Save
        </button>
      </mat-card-actions>
    </mat-card>
  </form>
